model:
  n_molecular_orbitals: 1
  n_metal_orbitals: 3
  n_electrons: 2
  n_vibrational_modes: 2

electronic:
  molecular_energies: [0.0]
  metal_energies: [-0.3, -0.1, 0.2]

  molecule_metal_couplings:
    - [0.10, 0.08, 0.05]

vibrational:
  frequencies: [0.5, 0.8]
  basis_sizes: [4, 4]

  electron_vibration_couplings:
    - [0.0, 0.0]

initial_state:
  occupied_orbitals: [1, 2]
  vibrational_levels: [0, 0]

propagation:
  t_final: 10.0
  n_times: 101

gan_terms:
  uij:
    - i: 0
      j: 0
      coefficient: 0.08
      factors:
        - mode: 0
          kind: linear

    - i: 0
      j: 0
      coefficient: 0.05
      factors:
        - mode: 1
          kind: linear