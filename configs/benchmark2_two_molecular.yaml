model:
  n_molecular_orbitals: 2
  n_metal_orbitals: 4
  n_electrons: 3
  n_vibrational_modes: 1

electronic:
  molecular_energies:
    [0.003, 0.005]

  metal_energies:
    [-0.003,
     -0.001,
      0.001,
      0.003]

  molecule_metal_couplings:
    - [0.00025,
       0.00025,
       0.00025,
       0.00025]

    - [0.00020,
       0.00020,
       0.00020,
       0.00020]

vibrational:
  frequencies: [0.0002]

  basis_sizes: [96]

  mode_types: [nonreactive]

  electron_vibration_couplings:
    - [0.0]
    - [0.0]

initial_state:
  # 0 = d1
  # 1 = d2
  # 2 = c1
  # 3 = c2
  # 4 = c3
  # 5 = c4
  #
  # Initially:
  # d1 occupied
  # d2 empty
  # c1,c2 occupied
  occupied_orbitals: [0, 2, 3]

  vibrational_levels: [0]

output:
  save_states: true

propagation:
  t_final: 10000.0
  n_times: 201

gan_terms:

  u0:
    - coefficient: 0.0001
      factors:
        - mode: 0
          kind: quadratic

  uij:
    - i: 0
      j: 0
      coefficient: -0.0012
      factors:
        - mode: 0
          kind: linear

    - i: 1
      j: 1
      coefficient: -0.0008
      factors:
        - mode: 0
          kind: linear