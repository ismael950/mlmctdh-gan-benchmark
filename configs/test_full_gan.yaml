model:
  n_molecular_orbitals: 2
  n_metal_orbitals: 2
  n_electrons: 2
  n_vibrational_modes: 2

electronic:
  molecular_energies: [0.0, 0.10]
  metal_energies: [-0.15, 0.20]

  # We turn off the old constant implementation.
  # Molecule-metal coupling will be introduced
  # through the general W_ik(Q) terms below.
  molecule_metal_couplings:
    - [0.0, 0.0]
    - [0.0, 0.0]

vibrational:
  frequencies: [0.5, 0.8]
  basis_sizes: [4, 4]

  # Old special electron-vibration coupling is off.
  # Nuclear dependence will come through the
  # general GAN terms below.
  electron_vibration_couplings:
    - [0.0, 0.0]
    - [0.0, 0.0]

initial_state:
  # Orbital ordering:
  # 0 = d1
  # 1 = d2
  # 2 = c1
  # 3 = c2
  #
  # Initially one electron in d1
  # and one in c1.
  occupied_orbitals: [0, 2]

  vibrational_levels: [0, 0]

propagation:
  t_final: 5.0
  n_times: 101

gan_terms:

  # --------------------------------------------------
  # U_0(Q)
  #
  # Morse potential for mode 0
  # + harmonic-like quadratic potential for mode 1
  # --------------------------------------------------

  u0:
    - coefficient: 1.0
      factors:
        - mode: 0
          kind: morse
          parameters:
            depth: 0.7
            alpha: 0.6
            equilibrium: 0.0

    - coefficient: 0.40
      factors:
        - mode: 1
          kind: quadratic

  # --------------------------------------------------
  # U_ij(Q) a_i^dagger a_j
  #
  # Coordinate-dependent coupling between
  # molecular orbitals d1 and d2
  # --------------------------------------------------

  uij:
    - i: 0
      j: 1
      coefficient: 0.05
      factors:
        - mode: 0
          kind: linear

    - i: 1
      j: 1
      coefficient: 0.02
      factors:
        - mode: 1
          kind: quadratic

  # --------------------------------------------------
  # V_ij(Q) n_i n_j
  #
  # Electron-electron interaction between
  # the two molecular orbitals
  # --------------------------------------------------

  vij:
    - i: 0
      j: 1
      coefficient: 0.03
      factors:
        - mode: 1
          kind: linear

  # --------------------------------------------------
  # W_ik(Q)
  #
  # Coordinate-dependent molecule-metal hopping
  # --------------------------------------------------

  wik:
    - i: 1
      k: 0
      coefficient: 0.08
      factors:
        - mode: 1
          kind: exponential
          parameters:
            alpha: 0.4
            center: 0.0

    - i: 0
      k: 1
      coefficient: 0.07
      factors:
        - mode: 0
          kind: tanh
          parameters:
            alpha: 0.5
            center: 0.0